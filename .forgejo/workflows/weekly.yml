# Weekly upgrade + curated main + summary email. Logic lives in ci/weekly.sh.
name: weekly
on:
  schedule:
    - cron: "0 10 * * 3"   # Wed 10:00 UTC = 03:00 America/Phoenix (no DST)
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run builds/plans/emails but pushes nothing"
        type: choice
        options: [dry-run, live]
        default: dry-run

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: nixos
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          ref: working
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}   # may push to working and main
      - name: weekly
        run: ci/weekly.sh
        env:
          MODE: ${{ inputs.mode || 'live' }} # schedule has no inputs -> live
