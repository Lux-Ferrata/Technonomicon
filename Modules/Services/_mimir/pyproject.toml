[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir"
version = "0.1.0"
description = "FSRS scheduling for the Mimir PrairieLearn practice course"
requires-python = ">=3.12"
dependencies = ["fsrs", "jsonschema"]

[project.scripts]
mimir = "mimir.cli:main"

[tool.setuptools]
packages = ["mimir"]

[tool.setuptools.package-data]
mimir = ["schemas/*.json", "incheck.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
